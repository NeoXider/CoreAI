<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430" role="img" aria-labelledby="t d"><title id="t">A streamed turn</title><desc id="d">Seven steps of one turn, with the failure case where the transport fails after a tool has already run</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#131a33"/></linearGradient><linearGradient id="gGreen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8cff7a"/><stop offset="1" stop-color="#2fbf4a"/></linearGradient><linearGradient id="gCyan" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7defff"/><stop offset="1" stop-color="#1b9fc0"/></linearGradient><linearGradient id="gPurple" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c3a8ff"/><stop offset="1" stop-color="#6c4be0"/></linearGradient><linearGradient id="gOrange" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffc27a"/><stop offset="1" stop-color="#e8661e"/></linearGradient><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa6cf"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ee05a"/></marker><filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1100" height="430" rx="18" fill="url(#bg)"/><rect x="0.75" y="0.75" width="1098.5" height="428.5" rx="17.5" fill="none" stroke="#2c3868" stroke-width="1.5"/><text x="40" y="46" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#eef2ff" text-anchor="start" >One turn: tools run while the model is still generating</text><rect x="40" y="86" width="136" height="190" rx="14" fill="#171f3b" stroke="#a07bff" stroke-width="1.5" /><circle cx="62" cy="108" r="13" fill="#a07bff" stroke="none" stroke-width="0" /><text x="62" y="113" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#0b1020" text-anchor="middle" >1</text><text x="108.0" y="142" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#eef2ff" text-anchor="middle" >Message in</text><text x="108.0" y="168" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9aa6cf" text-anchor="middle" >user or system input</text><text x="108.0" y="184" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9aa6cf" text-anchor="middle" >reaches the role</text><line x1="177" y1="180" x2="186" y2="180" stroke="#9aa6cf" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/><rect x="187" y="86" width="136" height="190" rx="14" fill="#171f3b" stroke="#38d6e8" stroke-width="1.5" /><circle cx="209" cy="108" r="13" fill="#38d6e8" stroke="none" stroke-width="0" /><text x="209" y="113" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#0b1020" text-anchor="middle" >2</text><text x="255.0" y="142" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#eef2ff" text-anchor="middle" >Model streams</text><text x="255.0" y="168" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9aa6cf" text-anchor="middle" >SSE chunks; split</text><text x="255.0" y="184" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9aa6cf" text-anchor="middle" >&lt;think&gt; tags and</text><text x="255.0" y="200" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9aa6cf" text-anchor="middle" >fragments reassembled</text><line x1="324" y1="180" x2="333" y2="180" stroke="#9aa6cf" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/><rect x="334" y="86" width="136" height="190" rx="14" fill="#171f3b" stroke="#5ee05a" stroke-width="1.5" /><circle cx="356" cy="108" r="13" fill="#5ee05a" stroke="none" stroke-width="0" /><text x="356" y="113" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#0b1020" text-anchor="middle" >3</text><text x="402.0" y="142" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#eef2ff" text-anchor="middle" >Tool call</text><text x="402.0" y="160" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#eef2ff" text-anchor="middle" >arrives</text><text x="402.0" y="186" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9aa6cf" text-anchor="middle" >tool-call deltas are</text><text x="402.0" y="202" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9aa6cf" text-anchor="middle" >handed on as they</text><text x="402.0" y="218" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9aa6cf" text-anchor="middle" >arrive</text><line x1="471" y1="180" x2="480" y2="180" stroke="#9aa6cf" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/><rect x="481" y="86" width="136" height="190" rx="14" fill="#171f3b" stroke="#ffd34e" stroke-width="1.5" /><circle cx="503" cy="108" r="13" fill="#ffd34e" stroke="none" stroke-width="0" /><text x="503" y="113" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#0b1020" text-anchor="middle" >4</text><text x="549.0" y="142" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#eef2ff" text-anchor="middle" >Policy check</text><text x="549.0" y="168" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9aa6cf" text-anchor="middle" >name repair, args and</text><text x="549.0" y="184" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9aa6cf" text-anchor="middle" >types, duplicates and</text><text x="549.0" y="200" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9aa6cf" text-anchor="middle" >timeouts checked</text><line x1="618" y1="180" x2="627" y2="180" stroke="#9aa6cf" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/><rect x="628" y="86" width="136" height="190" rx="14" fill="#171f3b" stroke="#ff9548" stroke-width="1.5" /><circle cx="650" cy="108" r="13" fill="#ff9548" stroke="none" stroke-width="0" /><text x="650" y="113" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#0b1020" text-anchor="middle" >5</text><text x="696.0" y="142" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#eef2ff" text-anchor="middle" >Tool runs</text><text x="696.0" y="168" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9aa6cf" text-anchor="middle" >up to 4 in parallel;</text><text x="696.0" y="184" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9aa6cf" text-anchor="middle" >mutations serialized;</text><text x="696.0" y="200" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9aa6cf" text-anchor="middle" >results in call order</text><line x1="765" y1="180" x2="774" y2="180" stroke="#9aa6cf" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/><rect x="775" y="86" width="136" height="190" rx="14" fill="#171f3b" stroke="#38d6e8" stroke-width="1.5" /><circle cx="797" cy="108" r="13" fill="#38d6e8" stroke="none" stroke-width="0" /><text x="797" y="113" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#0b1020" text-anchor="middle" >6</text><text x="843.0" y="142" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#eef2ff" text-anchor="middle" >Model</text><text x="843.0" y="160" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#eef2ff" text-anchor="middle" >continues</text><text x="843.0" y="186" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9aa6cf" text-anchor="middle" >results go back into</text><text x="843.0" y="202" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9aa6cf" text-anchor="middle" >the same turn</text><line x1="912" y1="180" x2="921" y2="180" stroke="#9aa6cf" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/><rect x="922" y="86" width="136" height="190" rx="14" fill="#171f3b" stroke="#ff6fa8" stroke-width="1.5" /><circle cx="944" cy="108" r="13" fill="#ff6fa8" stroke="none" stroke-width="0" /><text x="944" y="113" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#0b1020" text-anchor="middle" >7</text><text x="990.0" y="142" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#eef2ff" text-anchor="middle" >Typed receipt</text><text x="990.0" y="168" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9aa6cf" text-anchor="middle" >Ok, ErrorCode, retry</text><text x="990.0" y="184" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9aa6cf" text-anchor="middle" >hints, token usage,</text><text x="990.0" y="200" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9aa6cf" text-anchor="middle" >executed tools</text><path d="M334,292 L764,292" stroke="#5ee05a" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="549.0" y="316" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#5ee05a" text-anchor="middle" >the stream is still open here</text><rect x="40" y="344" width="1020" height="64" rx="14" fill="#1b1424" stroke="#ff9548" stroke-width="1.5" /><text x="60" y="372" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ff9548" text-anchor="start" >If the transport fails after a tool has already run:</text><text x="60" y="394" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#9aa6cf" text-anchor="start" >the client yields a terminal error chunk that carries the traces of what was executed, and the turn reports Ok = false instead of looking like success.</text></svg>
