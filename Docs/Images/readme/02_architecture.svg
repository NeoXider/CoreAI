<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="t d"><title id="t">CoreAI architecture</title><desc id="d">Your application talks to the CoreAI runtime, which talks to model providers</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#131a33"/></linearGradient><linearGradient id="gGreen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8cff7a"/><stop offset="1" stop-color="#2fbf4a"/></linearGradient><linearGradient id="gCyan" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7defff"/><stop offset="1" stop-color="#1b9fc0"/></linearGradient><linearGradient id="gPurple" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c3a8ff"/><stop offset="1" stop-color="#6c4be0"/></linearGradient><linearGradient id="gOrange" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffc27a"/><stop offset="1" stop-color="#e8661e"/></linearGradient><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa6cf"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ee05a"/></marker><filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1100" height="520" rx="18" fill="url(#bg)"/><rect x="0.75" y="0.75" width="1098.5" height="518.5" rx="17.5" fill="none" stroke="#2c3868" stroke-width="1.5"/><text x="40" y="46" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#eef2ff" text-anchor="start" >What sits between your application and the model</text><rect x="30" y="84" width="180" height="330" rx="16" fill="#171f3b" stroke="#5ee05a" stroke-width="1.5" /><text x="120" y="116" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#eef2ff" text-anchor="middle" >Your application</text><text x="120" y="150" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9aa6cf" text-anchor="middle" >A Unity game</text><text x="120" y="170" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9aa6cf" text-anchor="middle" ></text><text x="120" y="190" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9aa6cf" text-anchor="middle" >A plain .NET app,</text><text x="120" y="210" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9aa6cf" text-anchor="middle" >CLI or desktop tool</text><text x="120" y="230" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9aa6cf" text-anchor="middle" ></text><text x="120" y="250" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9aa6cf" text-anchor="middle" >A server-side agent</text><text x="120" y="270" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9aa6cf" text-anchor="middle" >(you own hosting,</text><text x="120" y="290" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9aa6cf" text-anchor="middle" >keys and storage)</text><rect x="228" y="84" width="644" height="330" rx="16" fill="#121a38" stroke="#38d6e8" stroke-width="2" /><text x="550" y="114" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#38d6e8" text-anchor="middle" >CoreAI runtime</text><rect x="244" y="134" width="200" height="124" rx="12" fill="#171f3b" stroke="#2c3868" stroke-width="1.5" /><rect x="244" y="148" width="5" height="96" rx="2.5" fill="#a07bff"/><text x="264" y="164" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#eef2ff" text-anchor="start" >Roles and prompts</text><text x="264" y="188" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9aa6cf" text-anchor="start" >AgentBuilder → AgentConfig</text><text x="264" y="208" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9aa6cf" text-anchor="start" >mode, temperature, budgets</text><text x="264" y="228" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9aa6cf" text-anchor="start" >roundtrip cap per role</text><rect x="452" y="134" width="200" height="124" rx="12" fill="#171f3b" stroke="#2c3868" stroke-width="1.5" /><rect x="452" y="148" width="5" height="96" rx="2.5" fill="#5ee05a"/><text x="472" y="164" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#eef2ff" text-anchor="start" >Tools the model calls</text><text x="472" y="188" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9aa6cf" text-anchor="start" >IAIFunctionLlmTool or a</text><text x="472" y="208" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9aa6cf" text-anchor="start" >delegate; arguments are</text><text x="472" y="228" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9aa6cf" text-anchor="start" >checked before it runs</text><rect x="660" y="134" width="200" height="124" rx="12" fill="#171f3b" stroke="#2c3868" stroke-width="1.5" /><rect x="660" y="148" width="5" height="96" rx="2.5" fill="#38d6e8"/><text x="680" y="164" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#eef2ff" text-anchor="start" >Skills</text><text x="680" y="188" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9aa6cf" text-anchor="start" >a catalog line per skill</text><text x="680" y="208" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9aa6cf" text-anchor="start" >plus two meta-tools;</text><text x="680" y="228" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9aa6cf" text-anchor="start" >documents load in stages</text><rect x="244" y="266" width="200" height="124" rx="12" fill="#171f3b" stroke="#2c3868" stroke-width="1.5" /><rect x="244" y="280" width="5" height="96" rx="2.5" fill="#ff9548"/><text x="264" y="296" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#eef2ff" text-anchor="start" >Scoped memory</text><text x="264" y="320" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9aa6cf" text-anchor="start" >tenant, user, session,</text><text x="264" y="340" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9aa6cf" text-anchor="start" >topic + role = one opaque</text><text x="264" y="360" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9aa6cf" text-anchor="start" >key for all stores</text><rect x="452" y="266" width="200" height="124" rx="12" fill="#171f3b" stroke="#2c3868" stroke-width="1.5" /><rect x="452" y="280" width="5" height="96" rx="2.5" fill="#ff6fa8"/><text x="472" y="296" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#eef2ff" text-anchor="start" >Provider routing</text><text x="472" y="320" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9aa6cf" text-anchor="start" >LocalModel, ClientOwnedApi,</text><text x="472" y="340" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9aa6cf" text-anchor="start" >ClientLimited, Offline,</text><text x="472" y="360" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9aa6cf" text-anchor="start" >ServerManagedApi; fallback</text><rect x="660" y="266" width="200" height="124" rx="12" fill="#171f3b" stroke="#2c3868" stroke-width="1.5" /><rect x="660" y="280" width="5" height="96" rx="2.5" fill="#ffd34e"/><text x="680" y="296" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#eef2ff" text-anchor="start" >Guardrails</text><text x="680" y="320" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9aa6cf" text-anchor="start" >timeouts, 429/5xx retry,</text><text x="680" y="340" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9aa6cf" text-anchor="start" >runaway-output cap,</text><text x="680" y="360" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9aa6cf" text-anchor="start" >SHA-256-chained audit log</text><rect x="890" y="84" width="180" height="330" rx="16" fill="#171f3b" stroke="#a07bff" stroke-width="1.5" /><text x="980" y="116" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#eef2ff" text-anchor="middle" >Model providers</text><text x="980" y="150" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9aa6cf" text-anchor="middle" >A local GGUF model</text><text x="980" y="170" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9aa6cf" text-anchor="middle" >(through LLMUnity)</text><text x="980" y="190" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9aa6cf" text-anchor="middle" ></text><text x="980" y="210" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9aa6cf" text-anchor="middle" >Any OpenAI-</text><text x="980" y="230" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9aa6cf" text-anchor="middle" >compatible API</text><text x="980" y="250" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9aa6cf" text-anchor="middle" ></text><text x="980" y="270" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9aa6cf" text-anchor="middle" >Your own backend</text><text x="980" y="290" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9aa6cf" text-anchor="middle" >that owns the keys</text><line x1="210" y1="250" x2="226" y2="250" stroke="#9aa6cf" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arr)"/><line x1="872" y1="250" x2="888" y2="250" stroke="#9aa6cf" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arr)"/><rect x="30" y="432" width="1040" height="62" rx="14" fill="#0f1530" stroke="#2c3868" stroke-width="1.5" /><text x="550" y="458" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#eef2ff" text-anchor="middle" >Streaming turn loop</text><text x="550" y="480" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9aa6cf" text-anchor="middle" >tool calls start executing as their arguments arrive; the turn does not wait for the stream to finish</text></svg>
