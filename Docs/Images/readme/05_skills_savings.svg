<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="300" viewBox="0 0 1100 300" role="img" aria-labelledby="t d"><title id="t">Self-Service Skills: context cost per request</title><desc id="d">An estimate: about 4,000 tokens of tool schemas without skills against about 360 with them</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#131a33"/></linearGradient><linearGradient id="gGreen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8cff7a"/><stop offset="1" stop-color="#2fbf4a"/></linearGradient><linearGradient id="gCyan" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7defff"/><stop offset="1" stop-color="#1b9fc0"/></linearGradient><linearGradient id="gPurple" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c3a8ff"/><stop offset="1" stop-color="#6c4be0"/></linearGradient><linearGradient id="gOrange" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffc27a"/><stop offset="1" stop-color="#e8661e"/></linearGradient><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa6cf"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ee05a"/></marker><filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1100" height="300" rx="18" fill="url(#bg)"/><rect x="0.75" y="0.75" width="1098.5" height="298.5" rx="17.5" fill="none" stroke="#2c3868" stroke-width="1.5"/><text x="40" y="46" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#eef2ff" text-anchor="start" >Self-Service Skills keep tool schemas out of every request</text><text x="40" y="98" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#eef2ff" text-anchor="start" >Without skills</text><text x="40" y="118" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#9aa6cf" text-anchor="start" >50 tools × ~80 tokens</text><rect x="300" y="80" width="700" height="40" rx="10" fill="#ff9548" stroke="none" stroke-width="0" /><text x="988" y="106" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#2a1100" text-anchor="end" >≈ 4,000 tokens per request</text><text x="40" y="178" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#eef2ff" text-anchor="start" >With skills</text><text x="40" y="198" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#9aa6cf" text-anchor="start" >2 meta-tools × ~80 + catalog ~200</text><rect x="300" y="160" width="63.0" height="40" rx="10" fill="#5ee05a" stroke="none" stroke-width="0" /><text x="377.0" y="186" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#5ee05a" text-anchor="start" >≈ 360 tokens per request</text><rect x="40" y="232" width="1020" height="40" rx="12" fill="#0f1530" stroke="#2c3868" stroke-width="1.5" /><text x="550" y="257" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9aa6cf" text-anchor="middle" >Estimates from the project docs for 50 tools in 10 skills. The model loads a skill's instructions only when it needs them.</text></svg>
