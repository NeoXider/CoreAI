<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="470" viewBox="0 0 1100 470" role="img" aria-labelledby="t d"><title id="t">CoreAI packages</title><desc id="d">Seven UPM packages in lockstep; the first two are required, the rest are optional with stated dependencies</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#131a33"/></linearGradient><linearGradient id="gGreen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8cff7a"/><stop offset="1" stop-color="#2fbf4a"/></linearGradient><linearGradient id="gCyan" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7defff"/><stop offset="1" stop-color="#1b9fc0"/></linearGradient><linearGradient id="gPurple" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c3a8ff"/><stop offset="1" stop-color="#6c4be0"/></linearGradient><linearGradient id="gOrange" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffc27a"/><stop offset="1" stop-color="#e8661e"/></linearGradient><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa6cf"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ee05a"/></marker><filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1100" height="470" rx="18" fill="url(#bg)"/><rect x="0.75" y="0.75" width="1098.5" height="468.5" rx="17.5" fill="none" stroke="#2c3868" stroke-width="1.5"/><text x="40" y="46" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#eef2ff" text-anchor="start" >Seven packages, two required</text><text x="1060" y="46" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9aa6cf" text-anchor="end" >versions move in lockstep; CI fails if they drift</text><text x="40" y="84" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#5ee05a" text-anchor="start" >REQUIRED</text><rect x="40" y="96" width="500" height="92" rx="14" fill="#171f3b" stroke="#2c3868" stroke-width="1.5" /><rect x="40" y="110" width="5" height="64" rx="2.5" fill="#5ee05a"/><text x="60" y="126" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#eef2ff" text-anchor="start" >com.neoxider.coreai</text><text x="60" y="150" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#9aa6cf" text-anchor="start" >Engine-free core: agents, tools, skills, memory,</text><text x="60" y="170" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#9aa6cf" text-anchor="start" >orchestration, OpenAI-compatible client</text><rect x="560" y="96" width="500" height="92" rx="14" fill="#171f3b" stroke="#2c3868" stroke-width="1.5" /><rect x="560" y="110" width="5" height="64" rx="2.5" fill="#5ee05a"/><text x="580" y="126" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#eef2ff" text-anchor="start" >com.neoxider.coreaiunity</text><text x="580" y="150" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#9aa6cf" text-anchor="start" >Unity host: DI, chat UI, streaming clients,</text><text x="580" y="170" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#9aa6cf" text-anchor="start" >WebGL transports, persistence, editor menus</text><line x1="540" y1="142" x2="560" y2="142" stroke="#5ee05a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrG)"/><text x="40" y="224" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#ff9548" text-anchor="start" >OPTIONAL  (what is missing simply compiles out)</text><rect x="40" y="236" width="184" height="130" rx="14" fill="#171f3b" stroke="#2c3868" stroke-width="1.5" /><rect x="40" y="250" width="5" height="102" rx="2.5" fill="#a07bff"/><text x="60" y="266" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#eef2ff" text-anchor="start" >coreaimods</text><text x="60" y="290" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9aa6cf" text-anchor="start" >Lua sandbox, execute_lua,</text><text x="60" y="310" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9aa6cf" text-anchor="start" >mod runtime, world API</text><text x="60" y="350" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#a07bff" text-anchor="start" >needs coreai + coreaiunity</text><rect x="249" y="236" width="184" height="130" rx="14" fill="#171f3b" stroke="#2c3868" stroke-width="1.5" /><rect x="249" y="250" width="5" height="102" rx="2.5" fill="#38d6e8"/><text x="269" y="266" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#eef2ff" text-anchor="start" >coreaihub</text><text x="269" y="290" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9aa6cf" text-anchor="start" >Tabbed UI Toolkit</text><text x="269" y="310" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9aa6cf" text-anchor="start" >hub window</text><text x="269" y="350" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#38d6e8" text-anchor="start" >needs coreai + coreaiunity</text><rect x="458" y="236" width="184" height="130" rx="14" fill="#171f3b" stroke="#2c3868" stroke-width="1.5" /><rect x="458" y="250" width="5" height="102" rx="2.5" fill="#ff6fa8"/><text x="478" y="266" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#eef2ff" text-anchor="start" >coreaimcp</text><text x="478" y="290" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9aa6cf" text-anchor="start" >In-game MCP server;</text><text x="478" y="310" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9aa6cf" text-anchor="start" >an external agent</text><text x="478" y="330" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9aa6cf" text-anchor="start" >drives the game</text><text x="478" y="350" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#ff6fa8" text-anchor="start" >needs coreaiunity + mods</text><rect x="667" y="236" width="184" height="130" rx="14" fill="#171f3b" stroke="#2c3868" stroke-width="1.5" /><rect x="667" y="250" width="5" height="102" rx="2.5" fill="#ff9548"/><text x="687" y="266" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#eef2ff" text-anchor="start" >coreaimirror</text><text x="687" y="290" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9aa6cf" text-anchor="start" >Mirror transport</text><text x="687" y="310" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9aa6cf" text-anchor="start" >for online worlds</text><text x="687" y="350" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#ff9548" text-anchor="start" >needs coreai + mods + Mirror</text><rect x="876" y="236" width="184" height="130" rx="14" fill="#171f3b" stroke="#2c3868" stroke-width="1.5" /><rect x="876" y="250" width="5" height="102" rx="2.5" fill="#ffd34e"/><text x="896" y="266" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#eef2ff" text-anchor="start" >coreaibenchmark</text><text x="896" y="290" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9aa6cf" text-anchor="start" >Game-creation benchmark</text><text x="896" y="310" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9aa6cf" text-anchor="start" >harness (dev and test only)</text><text x="896" y="350" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#ffd34e" text-anchor="start" >needs coreai + unity + mods</text><rect x="40" y="386" width="1020" height="62" rx="14" fill="#0f1530" stroke="#2c3868" stroke-width="1.5" /><text x="60" y="412" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#eef2ff" text-anchor="start" >Install profiles:</text><text x="190" y="412" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9aa6cf" text-anchor="start" >Base = coreai + coreaiunity   ·   + Mods   ·   + Hub   ·   Full = Base + Mods + Hub</text><text x="60" y="435" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#9aa6cf" text-anchor="start" >Plain .NET without Unity: build tools/portable/CoreAI.Core.csproj into CoreAI.Core.dll (netstandard2.1); a CI job proves it compiles with no Unity present.</text></svg>
